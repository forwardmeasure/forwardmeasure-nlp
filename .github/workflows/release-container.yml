name: Release Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Container version without a leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REQUESTED_VERSION:-${REF_NAME#v}}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify Contracts, Bindings, And Predictor
        run: ./scripts/verify.sh

      - name: Build And Push Immutable Version
        run: >-
          mvn --batch-mode --no-transfer-progress package
          -Pcontainer-image,container-image-push
          -Dcontainer-image.tag=${{ steps.version.outputs.value }}

